# ==========================================
# Configuración principal de Spring Boot
# ==========================================

# Nombre de la aplicación
spring.application.name=slot

# Perfil por defecto (dev)
spring.profiles.default=dev

# JPA / Hibernate
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate

# Flyway (Migraciones)
spring.flyway.clean-disabled=false
spring.flyway.validate-on-migrate=false

# Importar configuración local (credenciales reales de la PC/Mac)
spring.config.import=optional:application-local.properties

# Conexión a PostgreSQL (usa variables de entorno con valores por defecto)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/slotrat}
spring.datasource.username=${DB_USER:}
spring.datasource.password=${DB_PASSWORD:}